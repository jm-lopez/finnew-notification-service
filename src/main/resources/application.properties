spring.config.import=optional:file:.env[.properties]

spring.application.name=notification-service
server.port=8087

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

#JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update

#HEALTH MONITORING - ACTUATOR
management.endpoints.web.exposure.include=health, metric, info

#KAFKA CONFIG FOR CONSUMER
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notification-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.type.mapping=com.juanmatiaslopez.user_account_service.kafka.DTO.UserRegistrationEvent:com.juanmatiaslopez.notification_service.Kafka.DTO.UserRegistrationEvent,com.juanmatiaslopez.user_account_service.kafka.DTO.BalanceUpdateEvent:com.juanmatiaslopez.notification_service.Kafka.DTO.BalanceUpdateEvent

#EMAIL CONFIGURATION
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

#EUREKA Discover
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/